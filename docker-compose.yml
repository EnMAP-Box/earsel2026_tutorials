services:
  docs:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: sh -c "bundle install && echo 'Server will be available at http://localhost:4000' && bundle exec jekyll serve --livereload --host 0.0.0.0 --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - gems:/usr/local/bundle

volumes:
  gems:
